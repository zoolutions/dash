# Kamal deploy â the oss-infrastructure server (Cloudflare Tunnel + kamal-proxy).
# service/image = the repo OWNER/REPO so the ghcr package auto-links to the
# repo and GITHUB_TOKEN can push + pull it (no PAT). See docs-kit's README.
service: dash
image: zoolutions/dash

# dash 4 renamed the on-host proxy (kamal-proxy → dash-proxy) and migrates a
# host in place; an older CLI must not deploy this config.
minimum_version: 4.0.7

servers:
  web:
    hosts:
      - <%= ENV["DEPLOY_HOST"] %>

ssh:
  user: <%= ENV.fetch("DEPLOY_SSH_USER", "oss") %>

proxy:
  host: <%= ENV["DEPLOY_DOMAIN"] %>
  app_port: 3000
  ssl: false
  healthcheck:
    path: /up
    interval: 5
    timeout: 30

registry:
  server: ghcr.io
  username: mhenrixon
  password:
    - KAMAL_REGISTRY_PASSWORD

# The build context is the REPO ROOT (gem + app): the docs app depends on the
# gem via `gem "dash", path: ".."`, which the Docker build can only resolve if
# the whole repo is in the context. Kamal runs from docs/, so `dockerfile` is
# relative to docs/ (just "Dockerfile") while `context: ..` points at the root.
builder:
  arch: amd64
  context: ..
  dockerfile: Dockerfile

env:
  clear:
    RAILS_SERVE_STATIC_FILES: "true"
    RAILS_LOG_TO_STDOUT: "true"
    # A stateless docs site: SECRET_KEY_BASE only signs cookies (there is no user
    # data), so it's inlined rather than managed as a secret. Rotate with
    # `bin/rails secret`.
    SECRET_KEY_BASE: "3fae1a5fc3bac0cce1cb650dd08071ce690d8de335a31f787f5e6813bdf7511af90c817112674a11ee99d7e45c40f99bd0d560382280c99c030dd3dc87a24a0f"
