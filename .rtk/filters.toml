# Project-local RTK filters (https://github.com/rtk-ai/rtk#custom-filters).
#
# The `rtk hook claude` PreToolUse hook rewrites a matching command to
# `rtk <cmd>`; rtk runs it and drops the lines listed here before the agent
# sees the output. Filters are line-based: they strip noise, never reformat.
#
# `match_command` is matched against the command with the first word reduced
# to its basename, so `bin/validate_all`, `./bin/validate_all` and
# `validate_all` all hit `^validate_all\b`.
#
# Trust is a SHA-256 of this file: after every edit run `rtk trust --yes`
# (see AGENTS.md), then `rtk verify` to run the inline tests.
schema_version = 1

[filters.dash-unit-tests]
filter_stderr = true
description = "bundle exec ruby -Itest (unit tests, AGENTS.md verification command): drop duplicate-gem-load warnings, minitest boilerplate, and repeated deploy.yml advisory warnings; never touch a line carrying a minitest E/F/S marker"
match_command = "^bundle\\s+exec\\s+ruby\\b.*-Itest\\b"
strip_lines_matching = [
  "^\\s*$",
  "^Run options:",
  "^# Running:",
  "^\\.+$",
  "^Finished in ",
  "^/\\S+: warning: already initialized constant \\S+$",
  "^/\\S+: warning: previous definition of \\S+ was here$",
  "^\\.*Non-proxied role\\(s\\) \\S+ have no healthcheck\\. Without one, dash accepts the container as ready \\d+s after it merely starts and then stops the previous container — traffic can be dropped\\. Add a `healthcheck:` block, or opt out explicitly with `healthcheck: false`\\. This warning will become an error in a future release\\.$",
  "^\\.*Role\\(s\\) web: intercept_errors is set but no error_pages_path is configured, so dash-proxy replaces the app's error page with a bare plaintext status line\\. Set `error_pages_path:` to serve your own pages, or remove `intercept_errors` to let the app's through\\.$",
  "^\\.*boot/wait is set to \\d+ but boot/limit is not, so it does nothing\\. `wait` paces one group of hosts against the next, and without a limit every host boots in a single group\\. Set `boot/limit` or `boot/canary` to stagger the boot, or remove `boot/wait`\\.$",
  "^\\.*Role\\(s\\) web: target/max_idle_conns: 0 means the proxy default of 100, not \\\"keep none\\\" - dash-proxy resolves its defaults from zeros\\. Leave it unset for the default, or set 1 for the practical minimum\\.$",
]
on_empty = "dash unit tests: ok"

