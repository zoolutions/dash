[filters.rake-verify]
filter_stderr = true
description = "rake verify: drop duplicate-gem-load warnings (gem build/unpack shell out to a second ruby process), keep the gem metadata and the full file listing"
match_command = "^bundle\\s+exec\\s+rake\\s+verify\\b"
strip_lines_matching = [
  "^\\s*$",
  "^/\\S+: warning: already initialized constant \\S+$",
  "^/\\S+: warning: previous definition of \\S+ was here$",
]
on_empty = "rake verify: ok"

