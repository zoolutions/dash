# The label taxonomy for zoolutions/dash — the single source of truth.
#
# `bin/labels sync` makes GitHub match this file; `bin/labels validate` checks it
# offline. The rules live in .github/LABELS.md.
#
# Every label outside the `area` group, and the shared `devops`/`dx`/`docs-site`
# areas, come from docs-kit's labels kit (LABELS_KIT.md) and must stay identical
# to docs-kit's copy (`script/labels-kit check`). The other areas are this repo's.
---
# size:* is applied by an external triage tool, not by this repo.
ignore:
  - "size:*"

labels:
  # ---------------------------------------------------------------- type ----
  # Exactly one per issue/PR: what kind of work this is.
  - name: bug
    color: d73a4a
    description: Something isn't working
    group: type
  - name: enhancement
    color: a2eeef
    description: New feature or request
    group: type
  - name: performance
    color: fbca04
    description: Faster or leaner with no change in behaviour
    group: type
  - name: tech-debt
    color: 9c27bb
    description: Refactoring or cleanup that pays down an accepted shortcut
    group: type
  - name: security
    color: "e9e257"
    description: Vulnerability, hardening, or an authorization correctness fix
    group: type
  - name: documentation
    color: 0075ca
    description: Improvements or additions to documentation
    group: type
  - name: dependencies
    color: d93f0b
    description: Changes dependencies in some way
    group: type
  - name: chore
    color: ededed
    description: CI, tooling or configuration work with no behaviour change
    group: type

  # ---------------------------------------------------------------- area ----
  # One or more per issue/PR: which part of the code it touches. Shared first.
  - name: devops
    color: 006b75
    description: CI, the release kit, Docker, deploys and infrastructure
    group: area
  - name: dx
    color: 16a085
    description: Developer experience — agent commands and rules, generators, local tooling
    group: area
  - name: docs-site
    color: 2ea44f
    description: The documentation site under docs/
    group: area
  # dash's own areas.
  - name: proxy
    color: 1d76db
    description: dash-proxy integration — proxy config, flags, layering and the load balancer
    group: area
  - name: cli
    color: 0366d6
    description: The dash CLI commands and their output
    group: area
  - name: configuration
    color: 7eafec
    description: deploy.yml parsing, validation and defaults
    group: area
  - name: commands
    color: 5b8def
    description: The remote command builders — app, accessories, builder, docker
    group: area
  - name: build
    color: 3e6abd
    description: Image builds and the Dockerfile generator
    group: area
  - name: secrets
    color: 1f6feb
    description: Secrets adapters and env files
    group: area
  - name: observability
    color: 0e8a16
    description: Reports, timings, doctor and OpenTelemetry shipping
    group: area

  # -------------------------------------------------------------- status ----
  # Where an issue is in its lifecycle. Never on a pull request.
  - name: plan
    color: 6f42c1
    description: Has a /plan body with Context, Decision, Steps and Gates; ready for /lfg
    group: status
  - name: epic
    color: "5319e7"
    description: Umbrella item tracking several smaller issues
    group: status
  - name: blocker
    color: 8a63d2
    description: Blocks other work or a release until it is resolved
    group: status
  - name: needs-info
    color: d4c5f9
    description: Waiting on details before it can be planned or worked on
    group: status
  - name: flaky-test
    color: "e99695"
    description: A test that fails intermittently; filed by /debug-flaky
    group: status

  # ----------------------------------------------------------- community ----
  # GitHub's defaults, kept because GitHub surfaces them to contributors.
  - name: good first issue
    color: 7057ff
    description: Good for newcomers
    group: community
  - name: help wanted
    color: "008672"
    description: Extra attention is needed
    group: community
  - name: question
    color: d876e3
    description: Further information is requested
    group: community
  - name: duplicate
    color: cfd3d7
    description: This issue or pull request already exists
    group: community
  - name: invalid
    color: "e4e669"
    description: This doesn't seem right
    group: community
  - name: wontfix
    color: ffffff
    description: This will not be worked on
    group: community

  # -------------------------------------------------------------- legacy ----
  # Kept for the history they carry; never applied to new items.
  - name: gem
    color: c5def5
    description: "Legacy: the gem side of cross-repo work (every item in this repo is)"
    group: legacy

# Path globs -> area label, used by `bin/labels infer` and by /plan and /lfg to
# label deterministically from a diff. Matched with File.fnmatch and
# File::FNM_PATHNAME | File::FNM_EXTGLOB: write a recursive glob as `**/*`. A
# path may match several globs — every matching area applies.
paths:
  "lib/dash/**/*proxy*": proxy
  "lib/dash/**/*loadbalancer*": proxy
  "test/**/*proxy*": proxy
  "test/**/*loadbalancer*": proxy
  "bin/sync-proxy-flags": proxy
  "lib/dash/{cli,output,commander}/**/*": cli
  "lib/dash/{cli,output,commander}.rb": cli
  "lib/dash/configuration.rb": configuration
  "lib/dash/configuration/**/*": configuration
  "test/configuration/**/*": configuration
  "test/configuration_test.rb": configuration
  "lib/dash/commands.rb": commands
  "lib/dash/commands/**/*": commands
  "test/commands/**/*": commands
  "lib/dash/{build,dockerfile}/**/*": build
  "lib/dash/secrets.rb": secrets
  "lib/dash/env_file.rb": secrets
  "lib/dash/secrets/**/*": secrets
  "lib/dash/{report,timings,otel_shipper}.rb": observability
  "lib/dash/report/**/*": observability
  "test/{cli,output,commander}/**/*": cli
  "test/commander_test.rb": cli
  "test/{build,dockerfile}/**/*": build
  "test/{build,dockerfile}_*_test.rb": build
  "test/secrets_test.rb": secrets
  "test/env_file_test.rb": secrets
  "test/secrets/**/*": secrets
  "test/{report,timings,otel_shipper}_test.rb": observability
  "test/report/**/*": observability
  ".github/**/*": devops
  "bin/release": devops
  "rakelib/**/*": devops
  "**/Dockerfile*": devops
  ".claude/**/*": dx
  "{AGENTS,CLAUDE}.md": dx
  "bin/labels": dx
  "docs/**/*": docs-site
