name: Deploy docs

# Deploys the docs site (docs/) to the oss-infrastructure server via Kamal when a
# release is published, or on demand. The build + deploy logic is shared across
# all docs-kit sites — see zoolutions/docs-kit/.github/workflows/deploy.yml.
#
# `image`/`service` are the REPO name (dash) so the pushed ghcr package
# auto-links to this repo and GITHUB_TOKEN can push + pull it (no PAT). They must
# match `service:`/`image:` in docs/config/deploy.yml and the Dockerfile LABEL.
#
# The reusable workflow's defaults already build from the repo root
# (build_context ".", dockerfile "docs/Dockerfile", working_directory "docs"),
# which is what the `gem "dash", path: ".."` path dependency needs — so the
# caller only passes image + service. Deploying on release keeps the site's
# version badge (Dash::VERSION) in step with the published gem.
# The pinned docs-kit SHA below matters more than it looks. That reusable
# workflow installed the UPSTREAM kamal gem until 2026-08-27, and upstream kamal
# only ever reads `.kamal/secrets` — it knows nothing about `.dash/`. So while
# this file pinned a pre-dash SHA, stage 3a's move of docs/.kamal/ to .dash/
# silently broke the deploy with "Secret 'KAMAL_REGISTRY_PASSWORD' not found".
# Current docs-kit main installs `dash ~> 4.0.7` and runs `dash deploy`, which
# reads `.dash/secrets`. Keep the pin at or after d4936833 — or move
# docs/.dash/ back to .kamal/ — but not neither.

on:
  release:
    types: [published]
  workflow_dispatch:

# The caller MUST grant packages: write — a reusable workflow can only narrow the
# permissions it's given, never escalate. With the repo default of read-only, the
# build job's push would exceed the grant and fail at startup.
permissions:
  contents: read
  packages: write

jobs:
  deploy:
    # Pinned to a docs-kit main commit (2026-08-30, dash 4.0.7 floor) — this repo's zizmor gate
    # hash-pins every action ref. Bump the SHA to pick up fleet deploy changes.
    # secrets: inherit is deliberate and stays: DEPLOY_HOST/DEPLOY_DOMAIN are
    # `docs`-environment secrets that only resolve inside the called workflow's
    # `environment: docs` job — explicit named passing cannot see them.
    uses: zoolutions/docs-kit/.github/workflows/deploy.yml@833b23a566f48956143df4fb8f5f224d843e1c37 # zizmor: ignore[secrets-inherit]
    with:
      image: zoolutions/dash
      service: dash
    secrets: inherit
