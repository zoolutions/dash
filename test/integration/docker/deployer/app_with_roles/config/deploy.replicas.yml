servers:
  web:
    hosts:
      - vm1
      - vm2
    replicas: 2
  workers:
    hosts:
      - vm3
    # Traps the drain signal, so a scale-in drains instead of suspending the process.
    cmd: sh -c 'trap exit TSTP TERM; while true; do sleep 1; done'
    healthcheck: false
    replicas:
      min: 1
      max: 3
    drain:
      signal: TSTP
      wait: 1
