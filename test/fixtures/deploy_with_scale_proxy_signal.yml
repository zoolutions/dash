service: app
image: dhh/app
servers:
  web:
    hosts:
      - "1.1.1.1"
      - "1.1.1.2"
    scale:
      min: 2
      max: 4
      signal:
        source: proxy
      up:
        above: 50
        for: 30s
      down:
        below: 25
        for: 10m
  workers:
    hosts:
      - "1.1.1.3"
    cmd: bin/jobs
    healthcheck: false
proxy:
  host: app.example.com
autoscale:
  provider:
    upcloud:
      username:
        - UPCLOUD_USERNAME
      password:
        - UPCLOUD_PASSWORD
registry:
  username: user
  password: pw
builder:
  arch: amd64
readiness_delay: 0
