service: app
image: dhh/app
servers:
  web:
    - "1.1.1.1"
    - "1.1.1.2"
  workers:
    hosts:
      - "1.1.1.3"
      - "1.1.1.4"
    healthcheck: false
builder:
  arch: amd64

registry:
  username: user
  password: pw

proxy:
  loadbalancer: false

# Four hosts, one at a time — three gaps between four groups.
boot:
  limit: 1
  wait: 2
