service: app
image: dhh/app
servers:
  web:
    - "1.1.1.1"
  workers:
    hosts:
      - "1.1.1.3"
    cmd: bin/jobs
  pulse:
    hosts:
      - "1.1.1.4"
    cmd: bin/pulse
    options:
      health-cmd: "curl -f http://localhost:7434/readyz || exit 1"
      health-interval: 5s
registry:
  username: user
  password: pw
builder:
  arch: amd64
proxy:
  healthcheck:
    path: /healthz
readiness_delay: 7
