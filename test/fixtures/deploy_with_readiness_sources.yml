service: app
image: dhh/app
servers:
  web:
    - "1.1.1.1"
  workers:
    hosts:
      - "1.1.1.3"
    cmd: bin/jobs
  pulse:
    hosts:
      - "1.1.1.4"
    cmd: bin/pulse
    options:
      health-cmd: "curl -f http://localhost:7434/readyz || exit 1"
      health-interval: 5s
  listener:
    hosts:
      - "1.1.1.5"
    cmd: bin/listen
    healthcheck:
      port: 7434
      path: /readyz
  ticker:
    hosts:
      - "1.1.1.6"
    cmd: bin/tick
    healthcheck:
      cmd: "pgrep -f bin/tick"
  silent:
    hosts:
      - "1.1.1.7"
    cmd: bin/silent
    healthcheck: false
    readiness_delay: 2
  prober:
    hosts:
      - "1.1.1.8"
    cmd: bin/probe
    healthcheck:
      exec: "bin/ready-check"
registry:
  username: user
  password: pw
builder:
  arch: amd64
proxy:
  healthcheck:
    path: /healthz
readiness_delay: 7
