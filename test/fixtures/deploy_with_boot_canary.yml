service: app
image: dhh/app
servers:
  web:
    - "1.1.1.1"
    - "1.1.1.2"
    - "1.1.1.3"
  workers:
    hosts:
      - "1.1.1.4"
    cmd: bin/jobs
    healthcheck: false
builder:
  arch: amd64

registry:
  username: user
  password: pw

proxy:
  loadbalancer: false

# One web host proves the image alone, then the other three hosts boot together.
boot:
  canary: 1
  wait: 2
