service: app
image: dhh/app
servers:
  web:
    hosts:
      - "1.1.1.1"
    replicas: 2
  payments:
    hosts:
      - "1.1.1.2"
      - "1.1.1.3"
    cmd: bundle exec sidekiq -q payments
    healthcheck: false
    replicas:
      min: 1
      max: 3
    drain:
      signal: TSTP
      wait: 5
    stop_timeout: 45
registry:
  username: user
  password: pw
builder:
  arch: amd64
readiness_delay: 0
