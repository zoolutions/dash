service: app
image: dhh/app
servers:
  web:
    - "1.1.1.1"
    - "1.1.1.2"
  workers:
    hosts:
      - "1.1.1.3"
      - "1.1.1.4"
    healthcheck: false
builder:
  arch: amd64

registry:
  username: user
  password: pw

# Four app hosts, four accessory hosts. 25% has to mean one app host, not two.
accessories:
  mysql:
    image: mysql:8
    host: "1.1.1.5"
  redis:
    image: redis:7
    host: "1.1.1.6"
  memcached:
    image: memcached:1
    host: "1.1.1.7"
  elasticsearch:
    image: elasticsearch:8
    host: "1.1.1.8"

boot:
  limit: 25%
