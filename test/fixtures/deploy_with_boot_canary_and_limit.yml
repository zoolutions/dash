service: app
image: dhh/app
servers:
  web:
    - "1.1.1.1"
    - "1.1.1.2"
    - "1.1.1.3"
  workers:
    hosts:
      - "1.1.1.4"
    cmd: bin/jobs
    healthcheck: false
builder:
  arch: amd64

registry:
  username: user
  password: pw

proxy:
  loadbalancer: false

# The canary goes first; the limit slices what is left.
boot:
  canary: 1
  limit: 2
