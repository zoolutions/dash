service: app
image: dhh/app
servers:
  web:
    - "1.1.1.1"
  payments:
    hosts:
      - "1.1.1.2"
    cmd: bundle exec sidekiq -q payments
    healthcheck: false
    replicas:
      min: 1
      max: 3
    scale:
      min: 1
      max: 3
      boot_timeout: 240
      warmup: 300
      step: 3
      cooldown:
        down: 600
      schedule:
        - cron: "0 22 14 * *"
          for: 30h
          min: 6
  reports:
    hosts:
      - "1.1.1.3"
    cmd: bin/reports
    healthcheck: false
    replicas:
      min: 1
      max: 2
    scale:
      min: 1
      max: 2
      schedule:
        - cron: "0 9 * * 1-5"
          for: 1h
          min: 4
autoscale:
  provider:
    upcloud:
      username:
        - UPCLOUD_USERNAME
      password:
        - UPCLOUD_PASSWORD
  controller: 10.0.0.50
  interval: 10
  lock_wait_timeout: 30
  timezone: Europe/Stockholm
registry:
  username: user
  password: pw
builder:
  arch: amd64
readiness_delay: 0
