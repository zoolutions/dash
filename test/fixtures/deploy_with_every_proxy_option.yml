# Every proxy option the gem can express, in one config.
#
# test/proxy_flag_coverage_test.rb generates the kamal-proxy commands from this
# fixture and treats the flags that come out as the gem's real coverage. So a key
# only counts as "mapped" if setting it here actually produces a flag — a config
# accessor that exists but is never wired into deploy_options does not pass.
#
# When an R7 issue exposes a new flag, add its key here and delete the flag's
# waiver from the test. If the flag does not appear, the wiring is wrong.
service: app
image: dhh/app
servers:
  web:
    - "1.1.1.1"
registry:
  username: user
  password: pw
builder:
  arch: amd64
error_pages_path: public
deploy_timeout: 6
drain_timeout: 12
proxy:
  # Must stay off: load balancing deletes host/tls/basic-auth from deploy_options,
  # which would understate coverage.
  loadbalancer: false
  app_port: 3000
  hosts:
    - example.com
    - www.example.com
  ssl:
    certificate_pem: PROXY_CERT
    private_key_pem: PROXY_KEY
    client_ca_pem: CLIENT_CA_PEM
  ssl_staging: true
  ssl_redirect: true
  forward_headers: true
  strip_path_prefix: true
  path_prefixes:
    - /api
  response_timeout: 20
  read_routing:
    targets:
      - "1.1.1.2"
    websockets: true
    writer_affinity_timeout: 30
  path_response_timeouts:
    /uploads: 300
  exclude_metrics_paths:
    - /up
  request_timeout: 30
  path_request_timeouts:
    /uploads: 600
  target:
    max_conns: 100
    max_idle_conns: 10
    idle_conn_timeout: 90
    dial_timeout: 5
    disable_keep_alives: true
    try_duration: 30
    try_interval: 1
  healthcheck:
    path: /up
    interval: 2
    timeout: 5
    port: 4000
    host: healthcheck.example.com
  buffering:
    requests: true
    responses: true
    memory: 2_000_000
    max_request_body: 40_000_000
    max_response_body: 20_000_000
  basic_auth:
    username: admin
    password: secret
  session_affinity:
    enabled: true
    cookie: _kamal_affinity
  # sleep needs run/docker_socket below; it cannot coexist with on-demand TLS,
  # which lives in deploy_with_on_demand_tls.yml.
  sleep:
    after: 300
    wake_timeout: 30
    containers:
      - app-web
  headers:
    request:
      set:
        X-Forwarded-Host: app.example.com
      add:
        X-Request-Source: kamal
      remove:
        - X-Internal-Token
    response:
      set:
        Strict-Transport-Security: max-age=31536000
      add:
        X-Served-By: kamal-proxy
      remove:
        - Server
  redirects:
    - from: /old
      to: /new
      status: 302
  redirects_source:
    source: /api/v1/proxy/redirects
    interval: 300
  rewrites:
    - from: /api/(.*)
      to: /v2/$1
  canonical_host: www.example.com
  intercept_errors:
    - 502
    - 503
  # All three blocks together: trusted_proxies needs allow_ips or rate_limit to
  # do anything, and client_ip.header needs trusted_proxies.
  allow_ips:
    - 10.0.0.0/8
  deny_ips:
    - 203.0.113.0/24
  deny_user_agents:
    - 'BadBot/.*'
  client_ip:
    header: CF-Connecting-IP
    trusted_proxies:
      - 173.245.48.0/20
  rate_limit:
    requests: 100
    burst: 20
    exempt:
      - 10.0.0.0/8
  # The block form, so all three flags are emitted. The `compress: true`
  # shorthand is covered in test/configuration/proxy/compress_test.rb.
  compress:
    encodings:
      - zstd
      - gzip
    content_types:
      - text/html
    min_length: 1024
  cache:
    enabled: true
    max_ttl: 300
    max_body: 1_048_576
    max_variants: 8
    vary_headers:
      - Accept-Encoding
    vary_cookies:
      - locale
    allow_set_cookie: true
  logging:
    request_headers:
      - Cache-Control
    response_headers:
      - X-Request-Id
  ssl_domains:
    source: /api/v1/kamal/domains
    interval: 300
    batch_size: 5
  run:
    debug: true
    metrics_port: 9090
    docker_socket: /var/run/docker.sock
    log_format: text
    trace_context: generate
    min_tls: "1.3"
    http3: true
    reuse_port: true
    ignore_restore_errors: true
    proxy_protocol: true
    proxy_protocol_allow_ips:
      - 10.0.0.0/8
    metrics_allow_ips:
      - 10.0.0.0/8
    read_header_timeout: 10
    read_timeout: 30
    write_timeout: 30
    idle_timeout: 60
    shutdown_timeout: 15
    # Deliberately a name kamal-proxy will never have. run.flags forwards
    # anything, so a real flag here would fake coverage for it — see the note on
    # R7_BACKLOG in test/proxy_flag_coverage_test.rb.
    flags:
      not-a-real-kamal-proxy-flag: value
    acme:
      email: admin@example.com
      # The hash form (per-zone DNS-01 providers); the string shorthand is
      # covered in test/configuration/proxy/acme_test.rb.
      dns_provider:
        platform.example: cloudflare
        default: hetzner
      directory: https://acme-staging-v02.api.letsencrypt.org/directory
      # true renders as a bare flag, false as --flag=false; cover both shapes.
      prefer_wildcard: true
      http_fallback: false
    cache:
      store: redis://cache.example.com:6379/0
      store_timeout: 2
      memory_size: 134_217_728
