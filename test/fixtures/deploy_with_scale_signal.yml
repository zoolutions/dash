service: app
image: dhh/app
servers:
  web:
    - "1.1.1.1"
  payments:
    hosts:
      - "1.1.1.2"
    cmd: bundle exec sidekiq -q payments
    healthcheck: false
    replicas:
      min: 1
      max: 3
    drain:
      signal: TSTP
      wait: 600
    scale:
      min: 1
      max: 3
      boot_timeout: 240
      warmup: 300
      step: 2
      cooldown:
        up: 60
        down: 600
      signal:
        source: sidekiq
        queues:
          - payments
      up:
        above: 10
        for: 30s
      down:
        below: 2
        for: 10m
      hold_when:
        - source: postgres
          query: SELECT count(*) FROM pg_stat_activity
          above: 180
  reports:
    hosts:
      - "1.1.1.3"
    cmd: bin/reports
    healthcheck: false
    replicas:
      min: 1
      max: 2
    scale:
      min: 1
      max: 2
      schedule:
        - cron: "0 9 * * 1-5"
          for: 1h
          min: 4
autoscale:
  provider:
    upcloud:
      username:
        - UPCLOUD_USERNAME
      password:
        - UPCLOUD_PASSWORD
  interval: 10
  lock_wait_timeout: 30
  timezone: Europe/Stockholm
  redis:
    url: redis://cache.internal:6379/0
  postgres:
    url: postgres://app@db.internal/app
registry:
  username: user
  password: pw
builder:
  arch: amd64
readiness_delay: 0
